---
# PersistentVolume يدوي لـ SQL Server
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sqlserver-pv
  labels:
    app: sqlserver
    type: local
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain  # Retain للحفاظ على البيانات عند حذف PVC
  storageClassName: local-storage
  local:
    path: /mnt/sqlserver-data  # مسار على Node
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - kub  # اسم Node من kubectl get nodes

