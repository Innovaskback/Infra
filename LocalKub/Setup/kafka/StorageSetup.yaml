---
# ========================================
# Summary:
# ========================================
# - 1 StorageClass (local-storage)
# - 1 Job (create-kafka-zookeeper-storage)
# - 6 PersistentVolumes for Zookeeper (3 data + 3 logs)
# - 3 PersistentVolumes for Kafka (3 data)
# Total: 9 PersistentVolumes
#
# To apply:
# 1. kubectl apply -f StorageSetup.yaml
# 2. Wait for job completion: kubectl wait --for=condition=complete job/create-kafka-zookeeper-storage -n kafka
# 3. Verify PVs: kubectl get pv
# ========================================
