# ========================================
# Kafka & Zookeeper Storage Configuration
# ========================================
# This file sets up persistent storage for Kafka and Zookeeper
# - Creates StorageClass for local storage
# - Creates Job to prepare directories on host
# - Creates PersistentVolumes for all Kafka and Zookeeper nodes
# ========================================

---
# StorageClass for local storage (marked as default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  labels:
    app: kafka-zookeeper
    type: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
# Job to create all required directories on host machine
apiVersion: batch/v1
kind: Job
metadata:
  name: create-kafka-zookeeper-storage
  namespace: kafka
  labels:
    app: kafka-zookeeper
    component: storage-setup
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      hostPID: true
      containers:
      - name: directory-creator
        image: busybox:1.35
        command:
        - /bin/sh
        - -c
        - |
          echo "========================================="
          echo "Kafka & Zookeeper Storage Setup"
          echo "========================================="
          echo "Creating permanent directories..."
          echo ""

          # إنشاء المجلدات للزووكيبر (3 عقد)
          echo "Creating Zookeeper directories..."
          for i in 0 1 2; do
            mkdir -p /host-data/kafka-storage/zookeeper-data-$i
            mkdir -p /host-data/kafka-storage/zookeeper-logs-$i
            chmod 777 /host-data/kafka-storage/zookeeper-data-$i
            chmod 777 /host-data/kafka-storage/zookeeper-logs-$i
            echo "  ✓ Created zookeeper-data-$i and zookeeper-logs-$i"
          done

          echo ""
          echo "Creating Kafka directories..."
          # إنشاء المجلدات لكافكا (3 عقد)
          for i in 0 1 2; do
            mkdir -p /host-data/kafka-storage/kafka-data-$i
            chmod 777 /host-data/kafka-storage/kafka-data-$i
            echo "  ✓ Created kafka-data-$i"
          done

          echo ""
          echo "========================================="
          echo "All permanent directories created successfully!"
          echo "========================================="
          echo ""
          echo "Directory listing:"
          ls -la /host-data/kafka-storage/ | grep -E "(zookeeper|kafka)"

          echo ""
          echo "Storage paths (persistent after pod restarts):"
          echo "  Zookeeper data: /var/lib/kafka-storage/zookeeper-data-{0,1,2}"
          echo "  Zookeeper logs: /var/lib/kafka-storage/zookeeper-logs-{0,1,2}"
          echo "  Kafka data:     /var/lib/kafka-storage/kafka-data-{0,1,2}"
          echo ""
          echo "Storage setup completed successfully!"
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-data
          mountPath: /host-data
      volumes:
      - name: host-data
        hostPath:
          path: /var/lib
          type: DirectoryOrCreate
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists

---
# ========================================
# PersistentVolumes for Zookeeper
# ========================================

# Zookeeper Node 0 - Data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zookeeper-data-pv-0
  labels:
    app: zookeeper
    component: data
    node: "0"
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: /var/lib/kafka-storage/zookeeper-data-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: Exists

