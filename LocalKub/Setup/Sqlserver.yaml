apiVersion: v1
kind: Namespace
metadata:
  name: sqlserver
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sqlserver-init-script
  namespace: sqlserver
data:
  init.sql: |
    -- Wait for the database to be fully ready
    WAITFOR DELAY '00:00:05';
    
    -- Create the test database
    IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'Innovask_Serilog')
    BEGIN
      CREATE DATABASE Innovask_Serilog;
      PRINT 'Database Innovask_Serilog created successfully';
    END
    ELSE
    BEGIN
      PRINT 'Database Innovask_Serilog already exists';
    END
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: sqlserver
  labels:
    app: sqlserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
          name: sqlserver
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_SA_PASSWORD
          value: "039ab191-b080-4ace-956d-deddee908f55"
        - name: MSSQL_PID
          value: "Express"
        volumeMounts:
        - name: sqlserver-data
          mountPath: /var/opt/mssql
        - name: init-script
          mountPath: /tmp/init
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: sqlserver-data
        emptyDir:
          sizeLimit: 10Gi
      - name: init-script
        configMap:
          name: sqlserver-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-internal
  namespace: sqlserver
  labels:
    app: sqlserver
spec:
  type: ClusterIP
  ports:
  - port: 1433
    targetPort: 1433
    protocol: TCP
    name: sqlserver
  selector:
    app: sqlserver
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-external
  namespace: sqlserver
  labels:
    app: sqlserver
spec:
  type: NodePort
  ports:
  - port: 1433
    targetPort: 1433
    nodePort: 31434
    protocol: TCP
    name: sqlserver
  selector:
    app: sqlserver

